<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清辞全防</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 6 L88 22 V50 C88 72 72 86 50 94 C28 86 12 72 12 50 V22 Z' fill='url(%23g)'/%3E%3Ctext x='50' y='64' font-size='42' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E清%3C/text%3E%3C/svg%3E">
<style>
  /* ============ 基础 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-0: #0b0614;
    --bg-1: #14082e;
    --purple-1: #7c3aed;
    --purple-2: #a855f7;
    --purple-3: #c084fc;
    --pink: #d946ef;
    --pink-light: #f0abfc;
    --text: #f3eaff;
    --text-dim: #b9a6d9;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glow: 0 0 22px rgba(168, 85, 247, .55), 0 0 60px rgba(217, 70, 239, .25);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, var(--bg-0));
    color: var(--text);
    overflow-x: hidden;
  }

  /* ============ 科技感背景层 ============ */
  #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(95px); opacity: .5;
  }
  .orb-1 { width: 520px; height: 520px; top: -180px; left: -140px;
           background: radial-gradient(circle, #7c3aed, transparent 70%);
           animation: drift 14s ease-in-out infinite alternate; }
  .orb-2 { width: 460px; height: 460px; top: 22%; right: -180px;
           background: radial-gradient(circle, #d946ef, transparent 70%);
           animation: drift 18s ease-in-out infinite alternate-reverse; }
  .orb-3 { width: 420px; height: 420px; bottom: -160px; left: 32%;
           background: radial-gradient(circle, #a855f7, transparent 70%);
           animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(60px, -40px) scale(1.15); }
  }

  /* 扫描线 */
  .scanlines {
    position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.025) 0px,
      rgba(255, 255, 255, 0.025) 1px,
      transparent 1px,
      transparent 4px
    );
  }

  /* ============ 全屏页面 ============ */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 22px;
    scroll-snap-align: start;
  }

  .wrap { max-width: 980px; width: 100%; }

  /* ============ 首页按钮页 ============ */
  .brand { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 26px; }

  .logo {
    width: 84px; height: 84px; border-radius: 22px;
    background: linear-gradient(135deg, var(--purple-1), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 800; color: #fff;
    box-shadow: var(--glow);
    animation: logoFloat 4s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: clamp(40px, 9vw, 72px);
    font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(90deg, #e9d5ff, #f0abfc, #c084fc, #f0abfc);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shine 5s linear infinite;
    word-break: keep-all;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  .slogan {
    margin-top: 10px; font-size: clamp(13px, 2.6vw, 17px); color: var(--text-dim);
    letter-spacing: 3px; text-align: center; word-break: break-word;
  }

  /* 按钮组 */
  .actions { display: flex; gap: 22px; margin-top: 52px; justify-content: center; flex-wrap: wrap; }

  .btn {
    position: relative; overflow: hidden;
    min-width: 190px; padding: 18px 44px; border-radius: 18px;
    font-size: 17px; font-weight: 700; letter-spacing: 2px;
    text-align: center; text-decoration: none; cursor: pointer;
    border: 1px solid var(--glass-border);
    transition: transform .25s, box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn::after {
    content: ""; position: absolute; top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-20deg); transition: left .55s;
  }
  .btn:hover::after { left: 140%; }

  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, var(--purple-1), var(--pink));
    box-shadow: var(--glow);
  }
  .btn-primary:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 0 32px rgba(217, 70, 239, .8), 0 0 80px rgba(124, 58, 237, .4);
  }

  .btn-ghost {
    color: var(--text);
    background: var(--glass);
    backdrop-filter: blur(12px);
  }
  .btn-ghost:hover {
    transform: translateY(-4px) scale(1.03);
    border-color: var(--purple-3);
    box-shadow: 0 0 24px rgba(168, 85, 247, .35);
  }

  .hint {
    margin-top: 30px; font-size: 12px; color: rgba(185, 166, 217, .55);
    letter-spacing: 1px; text-align: center;
  }

  .scroll-hint {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    color: var(--text-dim); font-size: 12px; letter-spacing: 2px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }
  .scroll-hint .arrow {
    width: 14px; height: 14px; border-right: 2px solid var(--purple-3); border-bottom: 2px solid var(--purple-3);
    transform: rotate(45deg);
  }

  /* ============ 关于页 ============ */
  .about-title {
    font-size: clamp(26px, 6vw, 40px); font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(90deg, #f0abfc, #c084fc);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center;
  }

  .about-desc {
    margin: 22px auto 0; max-width: 720px;
    font-size: 15px; line-height: 2; color: var(--text-dim);
    text-align: center; word-break: break-word;
  }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; margin-top: 42px; }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 26px 22px;
    backdrop-filter: blur(14px);
    transition: transform .3s, border-color .3s, box-shadow .3s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: -40%; right: -30%;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(217, 70, 239, .28), transparent 70%);
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: var(--purple-3);
    box-shadow: 0 12px 34px rgba(124, 58, 237, .28);
  }
  .card .ico {
    width: 46px; height: 46px; border-radius: 13px;
    background: linear-gradient(135deg, rgba(124,58,237,.4), rgba(217,70,239,.4));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-bottom: 14px;
  }
  .card h3 { font-size: 16px; margin-bottom: 8px; letter-spacing: 1px; }
  .card p { font-size: 13px; color: var(--text-dim); line-height: 1.8; }

  .about-foot {
    margin-top: 46px; text-align: center;
  }
  .about-foot .ver {
    display: inline-block; padding: 8px 22px; border-radius: 999px;
    border: 1px solid var(--glass-border);
    font-size: 13px; color: var(--text-dim); letter-spacing: 2px;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 480px) {
    .btn { min-width: 150px; padding: 16px 30px; font-size: 15px; }
    .actions { gap: 14px; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="aurora">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="scanlines"></div>

<!-- ==================== 首页：按钮页（一整个屏幕） ==================== -->
<section class="page" id="home">
  <div class="wrap" style="text-align:center;">
    <div class="brand">
      <div class="logo">清</div>
      <div>
        <h1>清辞全防</h1>
        <p class="slogan">· FULL DEFENSE ·</p>
      </div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" id="downloadBtn" href="javascript:void(0)">立即下载</a>
      <a class="btn btn-ghost" href="#about">关于</a>
    </div>

    <p class="hint">极致防护 · 稳定连打 · 全新体验</p>
  </div>

  <div class="scroll-hint" onclick="document.getElementById('about').scrollIntoView({behavior:'smooth'})">
    <span>关于</span>
    <span class="arrow"></span>
  </div>
</section>

<!-- ==================== 关于页（一整个屏幕） ==================== -->
<section class="page" id="about">
  <div class="wrap">
    <div class="about-title">关于清辞全防</div>
    <p class="about-desc">
      清辞全防，真正的稳定，真正的好用，
      集成。
    </p>

    <div class="cards">
      <div class="card">
        <div class="ico">🛡</div>
        <h3>稳定思路</h3>
        <p>连打稳定，真切好用，用实力说明一切。</p>
      </div>
      <div class="card">
        <div class="ico">⚡</div>
        <h3>真正听的进去</h3>
        <p>愿意倾听用户提问，努力使清辞全防更加优秀。</p>
      </div>
      <div class="card">
        <div class="ico"> ୧⍢⃝୨</div>
        <h3></h3>
        <p>祝福各位用户使用愉快，稳定不拉闸。</p>
      </div>
      <div class="card">
        <div class="ico">🎨</div>
        <h3>MadeBuy</h3>
        <p>清辞团队。</p>
      </div>
    </div>

    <div class="about-foot">
      <span class="ver">清辞全防 · v1.0</span>
    </div>
  </div>
</section>

<script>
  // ⬇⬇⬇⬇⬇⬇ 立即下载按钮的跳转链接，把这里换成你的真实下载地址 ⬇⬇⬇⬇⬇⬇
  const DOWNLOAD_URL = "https://renshu.de5.net/";
  // ⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆

  document.getElementById('downloadBtn').addEventListener('click', function () {
    window.location.href = DOWNLOAD_URL;
  });

  // ============ 粒子科技感背景 ============
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  var pts = [], w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    init();
  }

  function init() {
    var count = Math.max(40, Math.min(110, Math.floor(w / 14)));
    pts = [];
    for (var i = 0; i < count; i++) {
      pts.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(217, 70, 239, 0.6)';
      ctx.fill();
    }
    for (var i = 0; i < pts.length; i++) {
      for (var j = i + 1; j < pts.length; j++) {
        var a = pts[i], b = pts[j];
        var d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 130) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = 'rgba(168, 85, 247, ' + (0.28 * (1 - d / 130)) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }

  resize();
  window.addEventListener('resize', resize);
  tick();
</script>
</body>
</html>
