<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="instap">

    <link rel="stylesheet" type="text/css" href="assets/style.css">
    <style>
        .item {
            transition:transform 0.3s ease-in-out,opacity 0.3s ease-in-out
        }
        .item:hover {
            transform:scale(1.05);
            opacity:0.9
        }
        .modal {
            display:none;
            position:fixed;
            z-index:1;
            padding-top:60px;
            left:0;
            top:0;
            width:100%;
            height:100%;
            overflow:auto;
            background-color:rgb(0,0,0);
            background-color:rgba(0,0,0,0.4)
        }
        .modal-content {
            margin:5% auto;
            padding:20px;
            border:1px solid #888;
            width:80%;
            max-width:700px
        }
        .close {
            color:#aaa;
            float:right;
            font-size:28px;
            font-weight:bold
        }
        .close:hover,.close:focus {
            color:black;
            text-decoration:none;
            cursor:pointer
        }
        .web_notice {
            display: none;
        }
        
        .bg-stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            will-change: opacity;
        }
        
        .bg-current { opacity: 1; z-index: 1; }
        .bg-next { opacity: 0; z-index: 2; }
        
        .header { position: relative; z-index: 5; }
        
        .logo {
            position: absolute;
            left: 50%;
            bottom: -50px;
            width: 100px;
            height: 100px;
            background-repeat: no-repeat;
            background-size: contain;
            margin-left: -50px;
            border: 5px solid #fff;
            border-radius: 50%;
            box-shadow: 0 10px 20px 5px #e6e8ea;
            z-index: 20;
            background-color: #fff;
        }
        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        #app {
            background-color: rgba(244, 246, 248, 0.92);
            position: relative;
            z-index: 1;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }
        
        .author-name {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            line-height: 36px;
            font-weight: 500;
            margin-top: 55px;
            position: relative;
            z-index: 5;
        }
        .desc {
            text-align: center;
            position: relative;
            z-index: 5;
            margin-top: 4px;
        }
        
        .body { position: relative; z-index: 5; }
        
        .tab-list {
            width: 100%;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .tab-item {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 35px;
            padding: 0 12px;
            width: 48%;
            background: #fff;
            border-radius: 17px;
            font-size: 14px;
            line-height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        .tab-item:last-child { margin-right: 0; }
        .tab-item .text { margin-left: 6px }
        .tab-item:before {
            content: "";
            display: inline-block;
            width: 16px;
            height: 16px;
            background-size: contain;
            background-position: 50%;
            background-repeat: no-repeat
        }
        .lx:before { background-image: url(../assets/lx.png) }
        .zy:before { background-image: url(../assets/zy.png) }
        
        .app-list {
            width: 100%;
            background: #f4f6f8;
            padding: 12px;
            flex-wrap: wrap;
            display: flex;
            box-sizing: border-box;
            justify-content: flex-start;
            align-items: center;
        }
        
        .item {
            width: 50%;
            padding: 8px;
            position: relative;
            color: #222;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        
        .content-wrap {
            width: 100%;
            background: #fff;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 14px 16px;
            border-radius: 17px;
        }
        
        .img-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            margin-right: 10px;
        }
        
        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        
        .app-name {
            font-size: 15px;
            line-height: 20px;
            width: 100%;
            word-break: break-all;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            font-family: PingFang SC;
            font-weight: 500;
        }
        
        .app-sub {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }
    
        /* ========== 清辞内核毛玻璃主题 ========== */
        html, body { min-height: 100%; background: transparent !important; }
        body { color: #fff; }
        #app { background: transparent !important; min-height: 100vh; }
        .header { padding-top: 14px; }
        .author-name { margin-top: 20px; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.35); }
        .desc { color: rgba(255,255,255,.82); text-shadow: 0 2px 10px rgba(0,0,0,.35); }
        .body { padding: 0 12px 110px; }
        .tab-list { padding: 0; gap: 10px; margin-bottom: 12px; }
        .tab-item {
            width: auto;
            flex: 1;
            margin-right: 0;
            color: #fff;
            background: rgba(255,255,255,.06) !important;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: 0 4px 12px rgba(0,0,0,.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .tab-item:hover { background: rgba(255,255,255,.10) !important; }
        .app-list .item {
            background: rgba(255,255,255,.06) !important;
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: 0 4px 12px rgba(0,0,0,.04);
            color: #fff !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .app-list .item:hover { background: rgba(255,255,255,.10) !important; }
        .app-name, .app-sub { color: #fff !important; text-shadow: 0 2px 8px rgba(0,0,0,.28); }
        .modal { background: rgba(0,0,0,.52); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .modal-content {
            background: rgba(15,30,50,.62);
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .close { color: rgba(255,255,255,.8); }

        #qingciSplash {
            background-color: #071b1d !important;
            background-image: url("photos/beijing/1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #qingciSplash::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(4,16,24,.34);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        #qingciSplash .qingciSplashInner {
            position: relative;
            z-index: 2;
            padding: 26px 34px;
            border-radius: 24px;
            background: rgba(4,22,31,.28);
            border: 1px solid rgba(255,255,255,.20);
            box-shadow: 0 18px 55px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.13);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        #qingciSplash .qingciSplashLy { color: #0b6b3b !important; margin-bottom: 46px; }
        #qingciSplash .qingciSplashQc { margin-top: 0 !important; color: #82ff9d !important; }

        /* ========== 最终覆盖 ========== */
        #app {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
        }
        .body, .tab-list, .app-list { background: transparent !important; }
        .content-wrap, .tab-item {
            background: rgba(255,255,255,.06) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255,255,255,.10) !important;
            box-shadow: 0 4px 12px rgba(0,0,0,.04) !important;
        }
        .app-list {
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-radius: 0 !important;
        }
        .logo {
            display: block;
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(255,255,255,.8);
            background: rgba(255,255,255,.25);
            backdrop-filter: blur(10px);
        }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>

    <script>
        jQuery(document).ready(function($) {
            $(".a1").css("display", "flex");
            $(".a2").css("display", "none");
            $(".zy").click(function() { 
                $(".a1").css("display", "flex"); 
                $(".a2").css("display", "none"); 
            });
            $(".lx").click(function() { 
                $(".a1").css("display", "none"); 
                $(".a2").css("display", "flex"); 
            });
        });
        
        function showModal(imageSrc) { 
            $("#modalImage").attr("src", imageSrc); 
            $("#myModal").css("display", "block"); 
        }
        $(".close").click(function() { 
            $("#myModal").css("display", "none"); 
        });
        $(window).click(function(event) { 
            if ($(event.target).is("#myModal")) { 
                $("#myModal").css("display", "none"); 
            } 
        });
        
        (function() {
            const backgroundImages = Array.from({length: 15}, (_, i) => `photos/beijing/${i + 1}.webp`);
            const fallbackBackground = 'photos/beijing/1.webp';
            const randomBackground = backgroundImages[Math.floor(Math.random() * backgroundImages.length)] || fallbackBackground;

            const splash = document.getElementById('qingciSplash');
            const bg1 = document.getElementById('bgLayer1');
            const bg2 = document.getElementById('bgLayer2');

            function applyBackground(src) {
                if (splash) splash.style.backgroundImage = `url("${src}")`;
                if (bg1) {
                    bg1.style.backgroundImage = `url("${src}")`;
                    bg1.style.opacity = '1';
                }
                if (bg2) bg2.style.opacity = '0';
            }

            const tester = new Image();
            tester.onload = function() {
                applyBackground(randomBackground);
            };
            tester.onerror = function() {
                applyBackground(fallbackBackground);
            };
            tester.src = randomBackground;
        })();
        </script>
