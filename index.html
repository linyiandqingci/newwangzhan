<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="instap">
    <link rel="icon" href="https://tc.lqay.cn/LightPicture/2026/03/5f64e0f0f361e19c.png">
    <title>永久引导页</title>

    <link rel="stylesheet" type="text/css" href="assets/style.css">

    <!-- ========== 预加载方案：提前告诉浏览器优先下载背景图 ========== -->
    <link rel="preload" as="image" href="photos/beijing/1.webp" fetchpriority="high">
    <link rel="preload" as="image" href="photos/beijing/2.webp" fetchpriority="high">
    <link rel="preload" as="image" href="photos/beijing/3.webp" fetchpriority="high">
    <link rel="preload" as="image" href="photos/beijing/4.webp" fetchpriority="high">
    <link rel="preload" as="image" href="photos/beijing/5.webp" fetchpriority="high">
    <!-- 如果你只希望预加载其中几张，删掉多余的即可 -->

    <style>
        /* ========== 基础重置与动画 ========== */
        .item { transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; }
        .item:hover { transform: scale(1.05); opacity: 0.9; }
        .modal { display: none; position: fixed; z-index: 1; padding-top: 60px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { margin: 5% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 700px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close:hover, .close:focus { color: black; text-decoration: none; cursor: pointer; }
        .web_notice { display: none; }

        /* ========== 背景系统 ========== */
        .bg-stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center center; background-repeat: no-repeat; will-change: opacity; }
        .bg-current { opacity: 1; z-index: 1; }
        .bg-next { opacity: 0; z-index: 2; }

        /* ========== 核心：彻底干掉背后那层大毛玻璃 ========== */
        #app, .body, .app-list, .tab-list {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            border: none !important;
        }

        /* ========== 页面基础布局 ========== */
        html, body { min-height: 100%; background: transparent !important; margin: 0; padding: 0; }
        body { color: #fff; }
        #app { min-height: 100vh; position: relative; z-index: 1; }

        /* 顶部区域 */
        .header { position: relative; z-index: 5; padding-top: 14px; }
        .logo { display: block; position: relative; width: 90px; height: 90px; margin: 0 auto 18px; border-radius: 50%; overflow: hidden; border: 4px solid rgba(255,255,255,.8); background: rgba(255,255,255,.25); backdrop-filter: blur(10px); }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .author-name { display: flex; width: 100%; justify-content: center; align-items: center; font-size: 25px; line-height: 36px; font-weight: 500; margin-top: 20px; position: relative; z-index: 5; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.35); }
        .desc { text-align: center; position: relative; z-index: 5; margin-top: 4px; color: rgba(255,255,255,.82); text-shadow: 0 2px 10px rgba(0,0,0,.35); }

        /* 主体内容区 */
        .body { position: relative; z-index: 5; padding: 0 12px 110px; }

        /* 导航标签：保留毛玻璃，模糊20px */
        .tab-list { width: 100%; padding: 0; display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 12px; }
        .tab-item { display: flex; align-items: center; justify-content: center; height: 35px; padding: 0 12px; width: auto; flex: 1; margin-right: 0; border-radius: 17px; font-size: 14px; line-height: 20px; cursor: pointer; color: #fff; background: rgba(255,255,255,.14) !important; border: 1px solid rgba(255,255,255,.28); box-shadow: 0 8px 30px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter: blur(20px) saturate(135%); -webkit-backdrop-filter: blur(20px) saturate(135%); }
        .tab-item:hover { background: rgba(255,255,255,.20) !important; }
        .tab-item .text { margin-left: 6px; }
        .tab-item:before { content: ""; display: inline-block; width: 16px; height: 16px; background-size: contain; background-position: 50%; background-repeat: no-repeat; }
        .lx:before { background-image: url(../assets/lx.png); }
        .zy:before { background-image: url(../assets/zy.png); }

        /* 单个卡片：保留毛玻璃，模糊20px */
        .item {
            width: 50%;
            padding: 8px;
            position: relative;
            color: #fff;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
        }
        .content-wrap {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 14px 16px;
            border-radius: 17px;
            background: rgba(255,255,255,.13) !important;
            border: 1px solid rgba(255,255,255,.20);
            box-shadow: 0 8px 24px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.12);
            backdrop-filter: blur(20px) saturate(125%);
            -webkit-backdrop-filter: blur(20px) saturate(125%);
        }
        .item:hover .content-wrap { background: rgba(255,255,255,.20) !important; }

        .img-wrap {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            margin-right: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        .img-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .app-name { font-size: 15px; line-height: 20px; width: 100%; word-break: break-all; text-overflow: ellipsis; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-family: PingFang SC; font-weight: 500; color: #fff !important; text-shadow: 0 2px 8px rgba(0,0,0,.28); }
        .app-sub { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }

        /* ========== 开屏与弹窗 ========== */
        .modal { background: rgba(0,0,0,.52); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .modal-content { background: rgba(15,30,50,.62); border: 1px solid rgba(255,255,255,.25); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .close { color: rgba(255,255,255,.8); }

        #qingciSplash { background-color: #071b1d !important; background-size: cover; background-position: center; background-repeat: no-repeat; position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; opacity: 1; pointer-events: auto; transition: opacity .8s ease; }
        #qingciSplash::after { content: ""; position: absolute; inset: 0; background: rgba(4,16,24,.34); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
        #qingciSplash .qingciSplashInner { text-align: center; position: relative; z-index: 2; padding: 26px 34px; border-radius: 24px; background: rgba(4,22,31,.28); border: 1px solid rgba(255,255,255,.20); box-shadow: 0 18px 55px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.13); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transform: scale(.55); opacity: 0; animation: qingciSplashIn 1.25s cubic-bezier(.22,1,.36,1) forwards; }
        #qingciSplash .qingciSplashLy, #qingciSplash .qingciSplashQc { font-family: Arial,"Microsoft YaHei",sans-serif; font-weight: 700; line-height: 1.15; letter-spacing: 4px; text-shadow: 0 0 18px rgba(105,255,139,.20), 0 2px 12px rgba(0,0,0,.28); }
        #qingciSplash .qingciSplashLy { font-size: clamp(30px,5vw,52px); color: #0b6b3b !important; margin-bottom: 46px; }
        #qingciSplash .qingciSplashQc { font-size: clamp(24px,4vw,42px); color: #82ff9d !important; letter-spacing: 5px; margin-top: 0 !important; }
        #qingciSplash.qingciSplashOut { opacity: 0; pointer-events: none; }
        @keyframes qingciSplashIn { 0% { opacity: 0; transform: scale(.55); } 55% { opacity: 1; transform: scale(1.02); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <!-- 背景图层 -->

    <div id="myModal" class="modal">
        <div class="modal-content">

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script>
        jQuery(document).ready(function($) {
            $(".a1").css("display", "flex");
            $(".a2").css("display", "none");
            $(".zy").click(function() { $(".a1").css("display", "flex"); $(".a2").css("display", "none"); });
            $(".lx").click(function() { $(".a1").css("display", "none"); $(".a2").css("display", "flex"); });
        });
        
        function showModal(imageSrc) { $("#modalImage").attr("src", imageSrc); $("#myModal").css("display", "block"); }
        $(".close").click(function() { $("#myModal").css("display", "none"); });
        $(window).click(function(event) { if ($(event.target).is("#myModal")) { $("#myModal").css("display", "none"); } });
        
        // ========== 背景图随机加载（配合预加载，瞬间显示） ==========
        (function() {
            const backgroundImages = Array.from({length: 15}, (_, i) => `photos/beijing/${i + 1}.webp`);
            const fallbackBackground = 'photos/beijing/1.webp';
            const randomBackground = backgroundImages[Math.floor(Math.random() * backgroundImages.length)] || fallbackBackground;

            const splash = document.getElementById('qingciSplash');
            const bg1 = document.getElementById('bgLayer1');
            const bg2 = document.getElementById('bgLayer2');

            function applyBackground(src) {
                if (splash) splash.style.backgroundImage = `url("${src}")`;
                if (bg1) { bg1.style.backgroundImage = `url("${src}")`; bg1.style.opacity = '1'; }
                if (bg2) bg2.style.opacity = '0';
            }

            // 因为有 preload，这里 Image 对象基本秒回，不会卡顿
            const tester = new Image();
            tester.onload = function() { applyBackground(randomBackground); };
            tester.onerror = function() { applyBackground(fallbackBackground); };
            tester.src = randomBackground;
        })();
    </script>
