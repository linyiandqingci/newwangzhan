    <style>
        .item {
            transition:transform 0.3s ease-in-out,opacity 0.3s ease-in-out
        }
        .item:hover {
            transform:scale(1.05);
            opacity:0.9
        }
        .modal {
            display:none;
            position:fixed;
            z-index:1;
            padding-top:60px;
            left:0;
            top:0;
            width:100%;
            height:100%;
            overflow:auto;
            background-color:rgb(0,0,0);
            background-color:rgba(0,0,0,0.4)
        }
        .modal-content {
            margin:5% auto;
            padding:20px;
            border:1px solid #888;
            width:80%;
            max-width:700px
        }
        .close {
            color:#aaa;
            float:right;
            font-size:28px;
            font-weight:bold
        }
        .close:hover,.close:focus {
            color:black;
            text-decoration:none;
            cursor:pointer
        }
        .web_notice {
            display: none;
        }
        
        /* ========== 页面背景 - 双图层系统 ========== */
        .bg-stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            will-change: opacity;
        }
        
        .bg-current {
            opacity: 1;
            z-index: 1;
        }
        
        .bg-next {
            opacity: 0;
            z-index: 2;
        }
        
        /* 背景图创意动画 */
        @keyframes bgFadeOutGlitch {
            0% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0px) brightness(1); }
            25% { opacity: 0.9; transform: scale(1.02) rotate(0.5deg); filter: blur(1px) brightness(1.1); }
            50% { opacity: 0.6; transform: scale(1.05) rotate(1deg); filter: blur(3px) brightness(1.2); }
            100% { opacity: 0; transform: scale(1.08) rotate(2deg); filter: blur(6px) brightness(1.3); }
        }
        
        @keyframes bgFadeInElastic {
            0% { opacity: 0; transform: scale(1.1) rotate(-2deg); filter: blur(10px) brightness(0.85); }
            30% { opacity: 0.4; transform: scale(0.98) rotate(0.5deg); filter: blur(3px) brightness(0.95); }
            60% { opacity: 0.8; transform: scale(1.01) rotate(-0.2deg); filter: blur(1px) brightness(1.02); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0px) brightness(1); }
        }
        
        .layer-animate-out { animation: bgFadeOutGlitch 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards !important; }
        .layer-animate-in { animation: bgFadeInElastic 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards !important; }
        
        /* ========== Banner 区域 - 修复图片溢出问题 ========== */
        .header {
            position: relative;
            z-index: 5;
        }
        
        /* 外层容器负责定位和头像空间，overflow: visible 让头像显示 */
        .banner-container {
            position: relative;
            width: 100%;
            height: 158px;
            margin-top: 15px;
            margin-bottom: 60px;
            border-radius: 16px;
            overflow: visible;  /* 让头像不被裁剪 */
        }
        
        /* 图片层容器 - 负责裁剪和滑动动画 */
        .banner-layers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;  /* 关键：这里裁剪图片，防止图片溢出到容器外 */
            z-index: 1;
        }
        
        .banner-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: 50%;
            background-repeat: no-repeat;
            will-change: transform, opacity;
        }
        
        .banner-current {
            opacity: 1;
            z-index: 1;
            transform: translateX(0%);
        }
        
        .banner-next {
            opacity: 1;
            z-index: 2;
            transform: translateX(100%);
        }
        
        /* 图片从左往右滑动 */
        @keyframes bannerSlideLeftToRight_out {
            0% { transform: translateX(0%); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        
        @keyframes bannerSlideLeftToRight_in {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0%); opacity: 1; }
        }
        
        /* 图片从右往左滑动 */
        @keyframes bannerSlideRightToLeft_out {
            0% { transform: translateX(0%); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0; }
        }
        
        @keyframes bannerSlideRightToLeft_in {
            0% { transform: translateX(100%); opacity: 0; }
            100% { transform: translateX(0%); opacity: 1; }
        }
        
        .banner-slide-ltr-out { animation: bannerSlideLeftToRight_out 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important; }
        .banner-slide-ltr-in { animation: bannerSlideLeftToRight_in 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important; }
        .banner-slide-rtl-out { animation: bannerSlideRightToLeft_out 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important; }
        .banner-slide-rtl-in { animation: bannerSlideRightToLeft_in 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important; }
        
        /* 光效扫过效果 */
        @keyframes bannerGlow {
            0% { opacity: 0; transform: translateX(-100%); }
            20% { opacity: 0.5; }
            100% { opacity: 0; transform: translateX(100%); }
        }
        
        .banner-glow::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 200, 0.5), transparent);
            animation: bannerGlow 0.5s ease-out forwards;
            border-radius: 16px;
        }

    <script>
        jQuery(document).ready(function($) {
            $(".a1").css("display", "flex");
            $(".a2").css("display", "none");
            $(".zy").click(function() { 
                $(".a1").css("display", "flex"); 
                $(".a2").css("display", "none"); 
            });
            $(".lx").click(function() { 
                $(".a1").css("display", "none"); 
                $(".a2").css("display", "flex"); 
            });
        });
        
        function showModal(imageSrc) { 
            $("#modalImage").attr("src", imageSrc); 
            $("#myModal").css("display", "block"); 
        }
        $(".close").click(function() { 
            $("#myModal").css("display", "none"); 
        });
        $(window).click(function(event) { 
            if ($(event.target).is("#myModal")) { 
                $("#myModal").css("display", "none"); 
            } 
        });
        
        // ========== 本地随机背景图 ==========
        // 开屏和网站主体使用同一张随机图片。
        // 图片固定放在 photos/beijing/1.webp ~ 15.png。
        (function() {
            const backgroundImages = Array.from({length: 15}, (_, i) => `photos/beijing/${i + 1}.webp`);
            const fallbackBackground = 'photos/beijing/1.webp';
            const randomBackground = backgroundImages[Math.floor(Math.random() * backgroundImages.length)] || fallbackBackground;

            const splash = document.getElementById('qingciSplash');
            const bg1 = document.getElementById('bgLayer1');
            const bg2 = document.getElementById('bgLayer2');

            function applyBackground(src) {
                if (splash) splash.style.backgroundImage = `url("${src}")`;
                if (bg1) {
                    bg1.style.backgroundImage = `url("${src}")`;
                    bg1.style.opacity = '1';
                }
                if (bg2) bg2.style.opacity = '0';
            }

            // 先使用随机图片；如果加载失败，则统一回退到 1.png。
            const tester = new Image();
            tester.onload = function() {
                applyBackground(randomBackground);
            };
            tester.onerror = function() {
                applyBackground(fallbackBackground);
            };
            tester.src = randomBackground;
        })();
        </script>
